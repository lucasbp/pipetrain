name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag matches Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "${TAG%%-*}" != "v$version" ]; then
            echo "tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --locked

  build:
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz
            packages: x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            archive: tar.gz
            packages: aarch64
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory dist | Out-Null
          $stage = "stage"
          New-Item -ItemType Directory $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/pipetrain.exe", LICENSE, README.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/pipetrain-$env:TAG-${{ matrix.target }}.zip"
      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist stage
          cp "target/${{ matrix.target }}/release/pipetrain" LICENSE README.md stage/
          tar -C stage -czf "dist/pipetrain-${TAG}-${{ matrix.target }}.tar.gz" pipetrain LICENSE README.md
      - name: Build .deb and .rpm
        if: matrix.packages
        run: |
          cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1
          cargo deb --no-build --target ${{ matrix.target }} --output dist/
          cargo generate-rpm --target ${{ matrix.target }} --arch ${{ matrix.packages }} --output dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- *.zip *.tar.gz *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --generate-notes --verify-tag $flags
