[package]
name = "pipetrain"
version = "0.4.0"
edition = "2024"
description = "Plans the merge order of pull requests across repos, read-only"
authors = ["Lucas Passos"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/lucasbp/pipetrain"
keywords = ["github", "pull-request", "merge", "deploy", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "pipetrain"
path = "src/lib.rs"

[[bin]]
name = "pipetrain"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
flate2 = "1.1.10"
globset = "0.4.21"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
toml = "1.1.8"
ureq = { version = "3.5.0", features = ["json"] }
yaml-rust2 = "0.13.0"
zip = { version = "9.2.1", default-features = false, features = ["deflate-flate2"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.deb]
maintainer = "Lucas Passos <lucasbp@users.noreply.github.com>"
section = "utils"
priority = "optional"
extended-description = "Reads open pull requests across repos and prints the order in which to merge them, and why. Read-only by default."
assets = [
    ["target/release/pipetrain", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/pipetrain/README.md", "644"],
    ["LICENSE", "usr/share/doc/pipetrain/LICENSE", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/pipetrain", dest = "/usr/bin/pipetrain", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/doc/pipetrain/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/pipetrain/README.md", mode = "644", doc = true },
]
