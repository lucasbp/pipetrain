[package]
name = "pipetrain"
version = "0.1.0"
edition = "2024"
description = "Plans the merge order of pull requests across repos, read-only"
authors = ["Lucas Passos"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/lucasbp/pipetrain"
keywords = ["github", "pull-request", "merge", "deploy", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "pipetrain"
path = "src/lib.rs"

[[bin]]
name = "pipetrain"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
globset = "0.4.21"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ureq = { version = "3.5.0", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
